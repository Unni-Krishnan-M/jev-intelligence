# Lint, type-check and test the Python packages; lint, type-check and build the web app.
# Tests that need the real MovieLens artifacts skip themselves when data/ and models/ are empty.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # the chain gate on SQLite (single head, round trip, CHECK parity) runs inside pytest above;
      # schema drift between the models and the migrations:
      - run: uv run alembic upgrade head && uv run alembic check
        env:
          JEV_DATABASE_URL: sqlite:///${{ runner.temp }}/alembic-check.db

  # PostgreSQL-only tests (every test with "postgres" in its name skips without JEV_TEST_POSTGRES_URL):
  # migration round trips and CHECK parity on the production database engine
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jev
          POSTGRES_PASSWORD: jev-ci-only
          POSTGRES_DB: jev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jev -d jev_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JEV_TEST_POSTGRES_URL: postgresql+psycopg://jev:jev-ci-only@localhost:5432/jev_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: PostgreSQL-only tests (a skip means the database was not reachable, so it fails the job)
        run: |
          set -o pipefail
          uv run pytest -q -k postgres -rs | tee pytest-postgres.txt
          ! grep -q skipped pytest-postgres.txt
      - name: alembic check on PostgreSQL
        run: uv run alembic upgrade head && uv run alembic check
        env:
          JEV_DATABASE_URL: ${{ env.JEV_TEST_POSTGRES_URL }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen   # route types (LayoutProps, PageProps) that tsc needs
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
